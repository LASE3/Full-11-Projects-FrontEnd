name: VOSTOKPRIBOR Multi-Engine CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  database-matrix-and-tests:
    name: PHP 8.2 on ${{ matrix.db.name }} (${{ matrix.db.version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MariaDB
            version: '10.4'
            image: 'mariadb:10.4'
            port: 3306
          - name: MariaDB
            version: '10.11'
            image: 'mariadb:10.11'
            port: 3306

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: vostokpribor
        ports:
          - ${{ matrix.db.port }}:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      VOSTOK_SSO_SECRET: ${{ secrets.VOSTOK_SSO_SECRET || 'vostok_enterprise_sso_secret_key_32chars_2026_x7a9' }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || 'VostokPribor2026!' }}
      BASE_URL: http://127.0.0.1:8080/
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: vostokpribor
      DB_USER: vostok_app
      DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, zip, mbstring, fileinfo, openssl, curl
          ini-values: |
            error_reporting=E_ALL
            display_errors=On
            display_startup_errors=On

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Environment Preflight Check
        run: |
          php scripts/check_env.php

      - name: Install Node.js Dependencies & Playwright Browsers
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium

      - name: Run Repository Hygiene Gate
        run: |
          php scripts/check_repo_hygiene.php

      - name: Run Touch Target & Responsive CSS Gate
        run: |
          php tests/test_touch_target_css.php

      - name: Run Repeated SQL Named Placeholders Scanner
        run: |
          php scripts/scan_repeated_placeholders.php

      - name: Run Dead Code & Clutter CI Gate
        run: |
          php scripts/find_dead_code.php

      - name: Create least-privilege app database user
        env:
          DB_ROOT_PASS: rootpassword
          DB_APP_USER: vostok_app
          DB_APP_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
        run: |
          MYSQL_PWD="$DB_ROOT_PASS" mysql --host=127.0.0.1 --port=${{ matrix.db.port }} --user=root -e "
            CREATE USER IF NOT EXISTS '${DB_APP_USER}'@'%' IDENTIFIED BY '${DB_APP_PASS}';
            CREATE USER IF NOT EXISTS '${DB_APP_USER}'@'localhost' IDENTIFIED BY '${DB_APP_PASS}';
            CREATE USER IF NOT EXISTS '${DB_APP_USER}'@'127.0.0.1' IDENTIFIED BY '${DB_APP_PASS}';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor\`.* TO '${DB_APP_USER}'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor\`.* TO '${DB_APP_USER}'@'localhost';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor\`.* TO '${DB_APP_USER}'@'127.0.0.1';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor_test\`.* TO '${DB_APP_USER}'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor_test\`.* TO '${DB_APP_USER}'@'localhost';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor_test\`.* TO '${DB_APP_USER}'@'127.0.0.1';
            FLUSH PRIVILEGES;
          "

      - name: Run Database Build & Migrations (Strict SQL Mode)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: root
          DB_PASS: rootpassword
          APP_ENV: local
        run: |
          php DataBase/build.php

      - name: Ensure app user privileges and configure CI .env
        env:
          DB_ROOT_PASS: rootpassword
          DB_APP_USER: vostok_app
          DB_APP_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
        run: |
          MYSQL_PWD="$DB_ROOT_PASS" mysql --host=127.0.0.1 --port=${{ matrix.db.port }} --user=root -e "
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor\`.* TO '${DB_APP_USER}'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor\`.* TO '${DB_APP_USER}'@'localhost';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor\`.* TO '${DB_APP_USER}'@'127.0.0.1';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor_test\`.* TO '${DB_APP_USER}'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor_test\`.* TO '${DB_APP_USER}'@'localhost';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON \`vostokpribor_test\`.* TO '${DB_APP_USER}'@'127.0.0.1';
            FLUSH PRIVILEGES;
          "
          echo "DB_HOST=127.0.0.1" > .env
          echo "DB_PORT=${{ matrix.db.port }}" >> .env
          echo "DB_NAME=vostokpribor" >> .env
          echo "DB_USER=vostok_app" >> .env
          echo "DB_PASS=${DB_APP_PASS}" >> .env
          echo "VOSTOK_SSO_SECRET=vostok_enterprise_sso_secret_key_32chars_2026_x7a9" >> .env
          echo "APP_ENV=test" >> .env
          echo "TEST_ADMIN_PASSWORD=AdminTest2026!Secure" >> .env
          echo "TEST_DB_NAME=vostokpribor_test" >> .env
          echo "BASE_URL=http://127.0.0.1:8080/" >> .env

      - name: Start PHP Built-in Server
        run: |
          php -S 127.0.0.1:8080 -t . &
          sleep 2

      - name: Run Security Headers & Cookie Hardening Gate
        env:
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/test_security_headers_cookies.php

      - name: Run Input Length Validation Regression Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/test_input_length_validation.php

      - name: Run SQL Injection Regression Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/test_sqli_regression.php

      - name: Run Migration 016 Portability & Idempotency Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
        run: |
          php tests/test_migration_016.php

      - name: Run API Smoke Sweeper (CEO, Employee, Customer)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php scripts/api_smoke.php

      - name: Run Maker-Checker Regression Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/test_maker_checker.php

      - name: Run Customer Password Isolation Regression Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/test_customer_password_isolation.php

      - name: Run Phase 4 Ownership & Developer Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/test_phase4_ownership_and_developer.php

      - name: Run Full Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
          APP_ENV: test
          BASE_URL: http://127.0.0.1:8080/
        run: |
          php tests/run_all_tests.php

      - name: Run Responsive & Mobile Zero-Overflow E2E Suite
        env:
          BASE_URL: http://127.0.0.1:8080/
        run: |
          node tests/e2e/responsive.spec.js

      - name: Run Click-Through E2E Suite
        env:
          BASE_URL: http://127.0.0.1:8080/
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_NAME: vostokpribor
          DB_USER: vostok_app
          DB_PASS: ${{ secrets.DB_APP_PASS || 'VostokApp2026!Secure' }}
        run: |
          node tests/e2e/clickthrough.spec.js
